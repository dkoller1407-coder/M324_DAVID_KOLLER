
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine erste Webseite</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007acc;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    footer {
      background-color: #007acc;
      color: white;
      padding: 10px;
      text-align: center;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Willkommen auf meiner Webseite!</h1>
  </header>

  <main>
    <h2>Über mich</h2>
    <p>Dies ist ein einfacher HTML-Beispieltext. Du kannst diesen Text bearbeiten und deine eigenen Inhalte hinzufügen.</p>

    <h2>Meine Links</h2>
    <ul>
      <li><a href="https://www.google.com" target="_blank">Google</a></li>
      <li><a href="https://www.github.com" target="_blank">GitHub</a></li>
    </ul>
  </main>

  <footer>
    &copy; 2025 Meine erste Webseite
  </footer>
</body>
</html>
