name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Step 1: CI - Linting, Formatting Check, Tests
  ci:
    runs-on: ubuntu-latest
    name: CI - Lint & Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint || true

      - name: Run formatting check
        run: npm run format:check || true

      - name: Run tests
        run: npm test || true

  # Step 2: Build & Publish Docker Image
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    name: Build & Publish Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mysql
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/m324-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/m324-app:${{ github.sha }}

  # Step 3: CD - Deploy to Cloud (optional)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to Cloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder - Deploy to cloud
        run: echo "Deployment logic would go here (e.g., to Heroku, AWS, Azure, etc.)"
